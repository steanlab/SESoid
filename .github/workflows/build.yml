name: build

on:
  push:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Find the project folder (the repository root, or a subfolder such as v300_ble/ if the zip was uploaded as is)
      - name: Locate the project
        run: |
          f=$(find . -name v300_ble_probe.slcp -not -path './.git/*' | head -1)
          test -n "$f" || { echo "v300_ble_probe.slcp not found in the repository"; exit 1; }
          echo "PROJ=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "project folder: $(dirname "$f")"

      # slc, the ARM compiler and the Gecko SDK all come from this public image
      - name: Pull the builder image
        run: docker pull ghcr.io/nabucasa/silabs-firmware-builder:latest

      - name: Build the firmware
        run: |
          chmod +x "$PROJ/build.sh"
          set -o pipefail
          docker run --rm --entrypoint bash \
            -v "$PWD/$PROJ":/build -w /build \
            ghcr.io/nabucasa/silabs-firmware-builder:latest ./build.sh 2>&1 | tee "$PROJ/build.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v300_ble_probe
          path: |
            ${{ env.PROJ }}/v300_ble_probe.bin
            ${{ env.PROJ }}/v300_ble_probe.elf
            ${{ env.PROJ }}/build.log
