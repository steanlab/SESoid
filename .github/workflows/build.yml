name: build

on:
  push:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Locate the project
        run: |
          f=$(find . -name v300_ble_probe.slcp -not -path './.git/*' | head -1)
          test -n "$f" || { echo "v300_ble_probe.slcp not found in the repository"; exit 1; }
          echo "PROJ=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "project folder: $(dirname "$f")"

      # The builder image brings slc and the ARM compiler but no SDK. Clone the Gecko SDK without LFS files, then fetch
      # only the one LFS file we need (a full LFS download of the SDK fails with "failed to fetch some objects").
      - name: Gecko SDK 4.4.1
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 -b v4.4.1 https://github.com/SiliconLabs/gecko_sdk.git gecko_sdk
          cd gecko_sdk
          git lfs install --local
          git lfs pull --include="platform/radio/rail_lib/autogen/librail_release/librail_efr32xg22_gcc_release.a"
          ls -l platform/radio/rail_lib/autogen/librail_release/librail_efr32xg22_gcc_release.a

      - name: Pull the builder image
        run: docker pull ghcr.io/nabucasa/silabs-firmware-builder:latest

      - name: Write the build script
        run: |
          cat > "$PROJ/ci_build.sh" <<'EOS'
          #!/bin/bash
          # Build inside the ghcr.io/nabucasa/silabs-firmware-builder image (it brings slc and the ARM compiler).
          # The Gecko SDK 4.4.1 is cloned by the workflow (only the one RAIL library is fetched through Git LFS) and mounted at /gecko_sdk.
          set -e

          echo "=== environment ==="
          uname -a
          echo "slc:     $(command -v slc || echo 'not in PATH')"
          echo "gcc:     $(command -v arm-none-eabi-gcc || echo 'not in PATH')"
          ls /opt /opt/silabs 2>/dev/null || true

          # Look for the tools if they are not in PATH.
          if ! command -v slc >/dev/null; then
            f=$(find / -xdev \( -name slc -o -name slc-cli \) -type f -perm -u+x 2>/dev/null | head -1)
            test -n "$f" && export PATH="$PATH:$(dirname "$f")"
          fi
          if ! command -v arm-none-eabi-gcc >/dev/null; then
            f=$(find / -xdev -name arm-none-eabi-gcc -type f 2>/dev/null | head -1)
            test -n "$f" && export PATH="$PATH:$(dirname "$f")"
          fi
          command -v slc || { echo "slc not found"; exit 1; }
          command -v arm-none-eabi-gcc || { echo "arm-none-eabi-gcc not found"; exit 1; }
          arm-none-eabi-gcc --version | head -1
          GSDK_PATH=/gecko_sdk
          test -f "$GSDK_PATH/gecko_sdk.slcs" || { echo "no Gecko SDK in $GSDK_PATH"; exit 1; }
          grep sdk_version "$GSDK_PATH/gecko_sdk.slcs"
          sz=$(stat -c %s "$GSDK_PATH/platform/radio/rail_lib/autogen/librail_release/librail_efr32xg22_gcc_release.a")
          echo "RAIL library size: $sz bytes"
          test "$sz" -gt 100000 || { echo "RAIL library is a Git LFS pointer, not the real file"; exit 1; }

          echo "=== slc ==="
          slc --version 2>&1 | head -3 || true
          java -version 2>&1 | head -3 || true
          ls /opt/silabs /opt/silabs/bin 2>/dev/null | head -30 || true
          echo "python3: $(command -v python3) $(python3 --version 2>&1)"
          slc configuration --sdk="$GSDK_PATH" 2>&1 | tail -1 || true
          slc signature trust --sdk "$GSDK_PATH" 2>&1 | tail -1 || true
          slc configuration --gcc-toolchain="$(dirname "$(dirname "$(command -v arm-none-eabi-gcc)")")/" 2>&1 | tail -1 || true

          # The templates of the SDK are run by an embedded Python (Jython) inside slc. "did not properly register a template generator"
          # means it could not start; try a few environment variants until one works.
          gen_ok=0
          try_gen() {  # $1 = label, rest = environment assignments
            label=$1; shift
            echo "=== slc generate, variant: $label ==="
            rm -rf ./out
            if env "$@" slc generate -s "$GSDK_PATH" -p v300_ble_probe.slcp -o makefile -d ./out -cp > gen_$label.log 2>&1; then
              tail -5 gen_$label.log; gen_ok=1
            else
              grep -v "^  " gen_$label.log | head -15
            fi
          }
          mkdir -p /tmp/h /tmp/jy
          try_gen plain      X=1
          [ $gen_ok = 1 ] || try_gen home       HOME=/tmp/h JAVA_TOOL_OPTIONS="-Dpython.cachedir=/tmp/jy -Djava.io.tmpdir=/tmp"
          [ $gen_ok = 1 ] || { cp -r "$GSDK_PATH" /tmp/gsdk_copy && GSDK_PATH=/tmp/gsdk_copy; slc configuration --sdk="$GSDK_PATH" >/dev/null 2>&1; slc signature trust --sdk "$GSDK_PATH" >/dev/null 2>&1; try_gen sdkcopy HOME=/tmp/h JAVA_TOOL_OPTIONS="-Dpython.cachedir=/tmp/jy -Djava.io.tmpdir=/tmp"; }
          [ $gen_ok = 1 ] || try_gen venv      PATH="/opt/venv/bin:$PATH" HOME=/tmp/h JAVA_TOOL_OPTIONS="-Dpython.cachedir=/tmp/jy"
          [ $gen_ok = 1 ] || { echo "slc generate failed in every variant"; exit 1; }
          cd out

          # The generated makefile does not allow C define overrides; harmless, but keep the same patch as upstream.
          sed -i 's/C_DEFS   =/C_DEFS ?=/' v300_ble_probe.Makefile

          # The SDK insists on the 32.768 kHz crystal (LFXO). Whether the V300 has one is not known: use the internal LFRCO.
          sed -i 's/, LFXO/, LFRCO/' autogen/sl_device_init_clocks.c
          sed -i 's/ sl_device_init_lfxo/\/\/ sl_device_init_lfxo/' autogen/sl_event_handler.c

          make -f v300_ble_probe.Makefile -j8

          cd ..
          arm-none-eabi-objcopy -O binary out/build/debug/v300_ble_probe.out v300_ble_probe.bin
          cp out/build/debug/v300_ble_probe.out v300_ble_probe.elf
          arm-none-eabi-size out/build/debug/v300_ble_probe.out
          ls -l v300_ble_probe.bin
          EOS
          chmod +x "$PROJ/ci_build.sh"

      - name: Build the firmware
        run: |
          set -o pipefail
          docker run --rm --entrypoint bash \
            -v "$PWD/$PROJ":/build -v "$PWD/gecko_sdk":/gecko_sdk -w /build \
            ghcr.io/nabucasa/silabs-firmware-builder:latest ./ci_build.sh 2>&1 | tee "$PROJ/build.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v300_ble_probe
          path: |
            ${{ env.PROJ }}/v300_ble_probe.bin
            ${{ env.PROJ }}/v300_ble_probe.elf
            ${{ env.PROJ }}/build.log
            ${{ env.PROJ }}/gen_*.log
